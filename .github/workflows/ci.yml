name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  BLOB_DATA_BASE_URL: ${{ secrets.BLOB_DATA_BASE_URL }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Jest unit tests
        run: npx jest --ci
      - name: Vitest suites (jest-excluded)
        run: npx vitest run __tests__/api/quiz-activity.test.ts __tests__/lib/supabase/queries.test.ts
      - name: Vitest AI suites (ai-sdk ESM fails under Jest)
        run: npm run test:ai

  # Lint currently fails on pre-existing react-hooks errors in avatar/Clea
  # components (new lint rules, files predate them). Run it as a non-blocking
  # signal until those files are migrated; does not gate the PR.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    # E2E hits the real Supabase project; skip when secrets aren't configured
    # (e.g. forks / first push before repo secrets are set).
    if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.E2E_USER_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Fetch curriculum data from Blob
        # data/*.jsonl is gitignored and not on the runner; prod reads it from
        # Vercel Blob, so pull the same source for the API-health tests.
        run: |
          mkdir -p data
          for f in classified-questions.jsonl medicospira-enriched.jsonl medicospira-questions.jsonl genetics-discriminators.json firstaid_text.jsonl pathoma_text.jsonl; do
            curl -sf "$BLOB_DATA_BASE_URL/$f" -o "data/$f" || echo "skipping $f (not in blob)"
          done
          ls -la data/ || true
      - name: Run Playwright e2e
        # No PLAYWRIGHT_BASE_URL: playwright.config.ts boots its own webServer
        # (npm run dev) against the data/ files fetched above.
        run: npx playwright test
